name: Release Plugin ZIP

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-plugin-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive release version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "${GITHUB_ENV}"

      - name: Validate committed versions for tagged release
        if: env.RELEASE_VERSION != ''
        run: |
          README_VERSION="$(grep -E '^Stable tag:' readme.txt | head -n1 | sed -E 's/^Stable tag:[[:space:]]*//')"
          PLUGIN_VERSION="$(grep -E '^ \* Version:' ai-provider-for-mistral.php | head -n1 | sed -E 's/^ \* Version:[[:space:]]*//')"

          echo "Tag version: ${RELEASE_VERSION}"
          echo "readme.txt Stable tag: ${README_VERSION}"
          echo "ai-provider-for-mistral.php Version: ${PLUGIN_VERSION}"

          if [ "${README_VERSION}" != "${RELEASE_VERSION}" ] || [ "${PLUGIN_VERSION}" != "${RELEASE_VERSION}" ]; then
            echo "::error::Version mismatch. Update readme.txt Stable tag and ai-provider-for-mistral.php Version to ${RELEASE_VERSION} before tagging."
            exit 1
          fi

      - name: Build plugin ZIP
        run: ./scripts/build-plugin-zip.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-provider-for-mistral-zip
          path: dist/ai-provider-for-mistral.zip
          if-no-files-found: error

      - name: Attach ZIP to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/ai-provider-for-mistral.zip
          generate_release_notes: true
